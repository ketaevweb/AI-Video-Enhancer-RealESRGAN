# ============================================================================
#  AI Video Enhancer - mpv configuration
#  The installer copies this file to  <mpv folder>\portable_config\mpv.conf
#  (next to mpv.exe) - the ONLY location next to the binary that mpv reads.
#  Conf files sitting directly next to mpv.exe are IGNORED by mpv.
#
#  AI enhancement is applied either by:
#    - the C:\AIVideoEnhancer\watch-AI-*.bat launchers (recommended), or
#    - the hotkeys in portable_config\input.conf: Ctrl+a / Ctrl+n / Ctrl+0
#
#  Measured speed on RTX 3080 (scripts\test-speed.ps1, 540p -> 4K):
#    enhance-2x.vpy         ~50-70 fps real-time (2x-speed profile, 360p -> 2K)
#    enhance-anime.vpy      ~34 fps   real-time
#    enhance-general.vpy    ~22 fps   real-time (single-model fast path)
#    enhance-film.vpy        ~2 fps   OFFLINE rendering only
#    enhance-film-hd.vpy     ~5 fps   OFFLINE rendering only
# ============================================================================

# --- base settings that play nicely with the AI pipeline --------------------
vo=gpu-next
hwdec=nvdec-copy
scale=ewa_lanczos
dscale=mitchell
deband=yes

# --- OPTIONAL: automatic AI for SD and 720p sources --------------------------
# Uncomment the [aivh-sd] block to auto-enhance every SD/720p file opened
# directly in mpv (drag a movie onto mpv.exe - no launcher needed).
# 480p/576p/540p and 720p get enhanced, 1080p+ plays untouched.
#
# KEEP IT COMMENTED if you watch through the watch-AI-*.bat launchers:
# the bats add the filter themselves, and an active auto-profile would
# chain a SECOND enhancer after the first one (model runs twice per frame).
#
# The path below must stay absolute (mpv does not know the working
# directory here). Quotes protect the drive colon from the option parser.
#
# [aivh-sd]
# profile-cond=get("video-params/h", 0) > 0 and get("video-params/h", 0) <= 820
# vf-add=vapoursynth=file="C:/AIVideoEnhancer/enhance-general.vpy":concurrent-frames=6
#
# anime variant - use this vf-add line instead (fastest, ~34 fps):
# vf-add=vapoursynth=file="C:/AIVideoEnhancer/enhance-anime.vpy":concurrent-frames=6
