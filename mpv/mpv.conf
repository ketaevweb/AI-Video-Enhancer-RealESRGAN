# ============================================================================
#  AI Video Enhancer - mpv configuration EXAMPLE
#  Copy the [aivh-*] blocks into your own mpv.conf
#  (Windows: %APPDATA%\mpv\mpv.conf  or  <mpv folder>\portable_config\mpv.conf)
#
#  This example is NOT applied automatically - the installer never touches
#  your existing mpv configuration.
#
#  Measured speed on RTX 3080 (scripts\test-speed.ps1, 540p -> 4K):
#    enhance-anime.vpy      ~34 fps   real-time
#    enhance-general.vpy    ~22 fps   borderline (see note below)
#    enhance-film.vpy        ~2 fps   OFFLINE rendering only
#    enhance-film-hd.vpy     ~5 fps   OFFLINE rendering only
# ============================================================================

# --- recommended base settings for AI-enhanced playback ---------------------
vo=gpu-next
hwdec=nvdec-copy
scale=ewa_lanczos
dscale=mitchell
deband=yes

# --- AI enhancement, automatic for SD and 720p sources ----------------------
# Both SD (480p/576p/540p) and 720p are fed into the 960x540 compact
# engines - the only ones that run in real time. Output is 2160p RGB.
# 1080p and above plays untouched - upscaling there wastes GPU time.
#
# The RRDB "max quality" engines (enhance-film / enhance-film-hd) are far
# below real-time speed on a RTX 3080. Do NOT put them into auto-profiles;
# they are meant for offline rendering of individual films.
#
# Live action (DVD/BD rips, old films): enhance-general.vpy (x4v3 + optional
#   denoise blend). If test-speed.ps1 marks it below 24 fps on your GPU,
#   swap the line below for enhance-anime.vpy (~34 fps, still good on film).
# Anime collection: use enhance-anime.vpy instead.

[aivh-sd]
profile-cond=get("video-params/h", 0) > 0 and get("video-params/h", 0) <= 820
vf-add=vapoursynth=C\:/AIVideoEnhancer/enhance-general.vpy:concurrent-frames=6

# anime variant - replace the vf-add line above with:
# vf-add=vapoursynth=C\:/AIVideoEnhancer/enhance-anime.vpy:concurrent-frames=6
