# ============================================================================
#  AI Video Enhancer - mpv configuration EXAMPLE
#  Copy the [aivh-*] blocks into your own mpv.conf
#  (Windows: %APPDATA%\mpv\mpv.conf  or  <mpv folder>\portable_config\mpv.conf)
#
#  This example is NOT applied automatically - the installer never touches
#  your existing mpv configuration.
# ============================================================================

# --- recommended base settings for AI-enhanced playback ---------------------
vo=gpu-next
hwdec=nvdec-copy
scale=ewa_lanczos
dscale=mitchell
deband=yes

# --- AI enhancement, automatic for SD and 720p sources ----------------------
# 480p/576p/540p  -> enhance-film.vpy   (RealESRGAN_x4plus, best detail)
# 720p            -> enhance-film-hd.vpy (RealESRGAN_x2plus, direct 720p->1440p;
#                                          auto-falls back to the 540p engine
#                                          while that engine is not built)
# 1080p and above plays untouched - upscaling there wastes GPU time.
#
# For an anime collection replace the script inside [aivh-sd] with
#   enhance-anime.vpy
# For old noisy DVD/VHS rips use
#   enhance-general.vpy   (clean + denoise model blend, see the .vpy header)

[aivh-sd]
profile-cond=get("video-params/h", 0) > 0 and get("video-params/h", 0) <= 600
vf-add=vapoursynth=C\:/AIVideoEnhancer/enhance-film.vpy

[aivh-hd]
profile-cond=get("video-params/h", 0) > 600 and get("video-params/h", 0) <= 820
vf-add=vapoursynth=C\:/AIVideoEnhancer/enhance-film-hd.vpy
