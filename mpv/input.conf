# ============================================================================
#  AI Video Enhancer - mpv input.conf EXAMPLE (optional hotkeys)
#  Copy the lines into your own input.conf if you want manual control.
# ============================================================================

# Toggle the film AI profile on/off (string must match the filter exactly)
Ctrl+a vf toggle "vapoursynth=C\:/AIVideoEnhancer/enhance-film.vpy"

# Switch to the denoise blend (old/noisy sources)
Ctrl+g vf set "vapoursynth=C\:/AIVideoEnhancer/enhance-general.vpy"

# Switch to the anime model
Ctrl+n vf set "vapoursynth=C\:/AIVideoEnhancer/enhance-anime.vpy"

# Full HD path for 720p (direct x2, no 540p normalization)
Ctrl+h vf set "vapoursynth=C\:/AIVideoEnhancer/enhance-film-hd.vpy"
