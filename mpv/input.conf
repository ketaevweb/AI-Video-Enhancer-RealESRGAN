# ============================================================================
#  AI Video Enhancer - mpv input.conf (hotkeys)
#  The installer copies this file to <mpv folder>\portable_config\input.conf.
#
#  Hotkeys work in ANY launch (launcher .bat or direct mpv.exe): the paths
#  below are absolute. Quotes around the file value protect the drive colon
#  from mpv's filter option parser (documented list-option quoting).
#
#  QUALITY v9 on RTX 3080, 2K internal size:
#  general (films): AI (general-x4v3) + texture restore on ALL sources
#                   (HD 720p+ and SD) - ~12-18 fps, removes compression
#                   noise/jaggies from streaming rips without the anime look
#  film (detail)  : pure model, no texture restore, ~10-15 fps
#  anime          : animevideov3 @ 960x540 -> 4K, ~23 fps (BEST for animation)
#  film-hd (RRDB) : offline only
#  AI-free natural view = Ctrl+0 (mpv ewa_lanczos + deband)
# ============================================================================

# PRIMARY for films: AI on every source (HD and SD) with the original
# texture merged back - enhancement WITHOUT the cartoon look.
Ctrl+a vf set vapoursynth=file="C:/AIVideoEnhancer/enhance-general.vpy":concurrent-frames=6

# Anime / animation model at maximum internal detail (960x540 -> 4K),
# ~23 fps. The painted look is CORRECT for anime - not for films.
Ctrl+n vf set vapoursynth=file="C:/AIVideoEnhancer/enhance-anime.vpy":concurrent-frames=6

# Pure-model detail mode for live action (x4v3 @ 640x360 -> 2K,
# ~10-15 fps, heavy scenes may drop frames, grain is erased)
Ctrl+f vf set vapoursynth=file="C:/AIVideoEnhancer/enhance-film.vpy":concurrent-frames=6

# Turn the AI filter off - AI-free NATURAL view (mpv ewa_lanczos +
# deband): best for clean high-bitrate rips, zero GPU cost
Ctrl+0 vf set ""

# Max-quality RRDB engine - NOT real-time. Uncomment only for
# short clips or if you accept slideshow playback:
#Ctrl+h vf set vapoursynth=file="C:/AIVideoEnhancer/enhance-film-hd.vpy":concurrent-frames=6
