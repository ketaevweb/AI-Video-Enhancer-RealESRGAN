# ============================================================================
#  AI Video Enhancer - mpv input.conf EXAMPLE (optional hotkeys)
#  Copy the lines into your own input.conf if you want manual control.
#
#  Speed on RTX 3080 (540p -> 4K): anime ~34 fps, general ~22 fps,
#  film / film-hd (RRDB) 2-5 fps = offline rendering only.
# ============================================================================

# Default AI profile: compact general model (live action, old rips)
Ctrl+a vf set "vapoursynth=C\:/AIVideoEnhancer/enhance-general.vpy:concurrent-frames=6"

# Anime model - fastest, real-time on RTX 3080
Ctrl+n vf set "vapoursynth=C\:/AIVideoEnhancer/enhance-anime.vpy:concurrent-frames=6"

# Turn the AI filter off (plain playback)
Ctrl+0 vf set ""

# Max-quality RRDB engines - NOT real-time (2-5 fps). Uncomment only for
# short clips or if you accept slideshow playback:
#Ctrl+f vf set "vapoursynth=C\:/AIVideoEnhancer/enhance-film.vpy"
#Ctrl+h vf set "vapoursynth=C\:/AIVideoEnhancer/enhance-film-hd.vpy"
